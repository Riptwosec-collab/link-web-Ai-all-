<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;width:340px;background:#060b13;color:#e2e8f0;font:12px Inter,system-ui,sans-serif}.wrap{padding:18px}.brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#22d3ee);font-weight:800}.brand b{display:block;font-size:13px}.brand small{color:#64748b}.card{margin-top:16px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.03);padding:13px}.title{font-weight:600;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url{margin-top:6px;color:#64748b;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.option{display:flex;gap:9px;align-items:center;margin-top:13px;color:#94a3b8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}button{height:39px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#cbd5e1;font-weight:700;cursor:pointer}button.primary{background:linear-gradient(100deg,#2563eb,#0891b2);border:0;color:white}#status{min-height:16px;margin-top:10px;text-align:center;color:#67e8f9;font-size:10px}</style></head><body><div class="wrap"><div class="brand"><div class="mark">↗</div><div><b>Smart Link Hub</b><small>V6 Capture</small></div></div><div class="card"><div id="title" class="title">Loading current tab…</div><div id="url" class="url"></div><label class="option"><input id="read-later" type="checkbox"> Add to Read Later</label></div><div class="actions"><button id="open">Open Hub</button><button id="save" class="primary">Save tab</button></div><div id="status"></div></div><script src="popup.js"></script></body></html>
