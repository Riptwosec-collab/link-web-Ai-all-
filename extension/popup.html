<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Link Hub V7 Capture</title><style>:root{--bg:#020304;--panel:#070a0f;--panel2:#0a0e14;--border:rgba(255,255,255,.09);--accent:#f5c542;--accent2:#ffe28a;--muted:#8b919c;--text:#fff;--input:#010409}*{box-sizing:border-box}body{margin:0;width:370px;max-height:580px;overflow:auto;background:radial-gradient(circle at 10% -8%,rgba(245,197,66,.12),transparent 32%),var(--bg);color:var(--text);font:12px Inter,system-ui,sans-serif}.wrap{padding:17px}.brand{display:flex;align-items:center;gap:10px}.mark{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#c88900,#f5c542,#ffe28a);color:#080808;font-weight:900;box-shadow:0 0 25px rgba(245,197,66,.22)}.brand b{display:block;font-size:13px}.brand small{color:var(--muted);font-size:9px}.card{margin-top:14px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(145deg,rgba(10,14,20,.96),rgba(7,10,15,.96));padding:13px;box-shadow:0 16px 45px rgba(0,0,0,.25)}.title{font-weight:650;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url{margin-top:6px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:#69717e}.field input,.field select{height:36px;border:1px solid var(--border);border-radius:10px;background:var(--input);color:#e8ebf0;outline:0;padding:0 10px;font-size:10px}.field input:focus,.field select:focus{border-color:rgba(245,197,66,.45);box-shadow:0 0 0 3px rgba(245,197,66,.05)}.field select option{background:#07090d}.toggles{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.option{min-height:37px;display:flex;gap:8px;align-items:center;padding:0 9px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.02);color:#a5abb5;font-size:9px}.option input{accent-color:var(--accent)}.hint{margin-top:9px;color:#59606a;font-size:8px;line-height:1.5}.actions{display:grid;grid-template-columns:.72fr 1.28fr;gap:8px;margin-top:13px}button{height:40px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.035);color:#c8cdd5;font-weight:700;font-size:10px;cursor:pointer}button:hover{border-color:rgba(245,197,66,.22);color:white}button.primary{background:linear-gradient(110deg,#c88900,#f5c542,#ffe28a);border-color:rgba(245,197,66,.38);color:#080808;box-shadow:0 8px 24px rgba(200,137,0,.18)}button:disabled{opacity:.45;cursor:not-allowed}.shortcut{margin-top:9px;text-align:center;color:#525965;font-size:8px}.shortcut kbd{padding:2px 5px;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:#8e96a2}#status{min-height:17px;margin-top:9px;text-align:center;color:var(--accent2);font-size:9px;line-height:1.45}.ok{color:#86efac!important}.bad{color:#fca5a5!important}</style></head><body><div class="wrap"><div class="brand"><div class="mark">↗</div><div><b>Smart Link Hub</b><small>V7 Smart Capture · Auto Cloud</small></div></div><div class="card"><div id="title" class="title">Loading current tab…</div><div id="url" class="url"></div><div class="grid"><div class="field"><label>Collection</label><select id="collection"><option value="col_inbox">Inbox</option><option value="col_ai">AI & Research</option><option value="col_dev">Development</option></select></div><div class="field"><label>Custom collection ID</label><input id="custom-collection" placeholder="optional"></div><div class="field full"><label>Tags</label><input id="tags" placeholder="research, security, later"></div></div><div class="toggles"><label class="option"><input id="read-later" type="checkbox"> Read Later</label><label class="option"><input id="favorite" type="checkbox"> Favorite</label></div><div class="hint">V7 normalizes tracking URLs and checks duplicates after the Hub opens. Your capture is saved locally first, then Auto Cloud Sync runs.</div></div><div class="actions"><button id="open">Open Hub</button><button id="save" class="primary">Save current tab</button></div><div class="shortcut">Quick save shortcut: <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd></div><div id="status"></div></div><script src="popup.js"></script></body></html>
