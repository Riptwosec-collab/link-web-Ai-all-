name: Smart Link Hub JavaScript Syntax Gate

# Full syntax coverage is now part of the primary V8.1 verification workflow.
# Keep this standalone gate for manual diagnostics without paying for a second
# runner on every main push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every JavaScript source
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            echo "Checking $f"
            node --check "$f"
          done < <(find js worker/src extension tests -type f -name '*.js' -print0)
          node --check sw.js
          node --check playwright.config.js
