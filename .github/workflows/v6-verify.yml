name: Smart Link Hub V8.1 Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          set -e
          for f in \
            js/db.js js/cloud-links.js js/v8-data-center.js js/v8-ui-patch.js js/v8-reliability.js js/runtime-fix-v82.js js/auto-cloud-sync.js js/auto-cloud-ui.js js/nav-hotfix-v79.js js/auth-gate.js js/auth-v81-patch.js \
            js/v6-platform.js js/v6-bridge.js js/v6-import.js js/v6-bulk-extra.js js/theme-v61.js \
            js/e2e-boot.js js/v7/core.js js/v7/search-worker.js js/v7/knowledge.js js/v7/mobile.js js/v7/boot.js js/v7/quick-capture.js \
            sw.js worker/src/index.js extension/popup.js extension/background.js playwright.config.js tests/v7.spec.js tests/v81-reliability.spec.js; do
            node --check "$f"
          done

      - name: Verify V8.1 contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const need=f=>{if(!fs.existsSync(f))throw new Error('Missing '+f)};
          const migrations=[
            'supabase/migrations/20260910013000_smartlink_v8_cloud_links.sql',
            'supabase/migrations/20260910014500_smartlink_v8_retire_legacy_link_state.sql',
            'supabase/migrations/20260910021500_smartlink_v81_auth_identity.sql',
            'supabase/migrations/20260910021600_smartlink_v81_integrity_conflicts.sql',
            'supabase/migrations/20260910021700_smartlink_v81_observability.sql',
            'supabase/migrations/20260910021800_smartlink_v81_safe_purge.sql'
          ];
          const files=['build-meta.json','manifest.webmanifest','index.html','share.html','_headers','css/utility-v81.css','css/icons-v81.css','css/runtime-fix-v82.css','css/v7.css','css/data-v8.css','js/v7/boot.js','js/v7/core.js','js/v7/knowledge.js','js/v7/mobile.js','js/v7/quick-capture.js','js/e2e-boot.js','js/auth-v81-patch.js','js/db.js','js/cloud-links.js','js/v8-data-center.js','js/v8-ui-patch.js','js/v8-reliability.js','js/runtime-fix-v82.js','js/auto-cloud-sync.js','js/auto-cloud-ui.js','worker/src/index.js','extension/manifest.json',...migrations];files.forEach(need);
          for(const f of ['manifest.webmanifest','extension/manifest.json','build-meta.json','package.json'])JSON.parse(fs.readFileSync(f,'utf8'));

          const meta=JSON.parse(fs.readFileSync('build-meta.json','utf8'));
          if(meta.version!=='8.1.0'||meta.buildId!=='slh-v81-20260910'||Number(meta.dataSchema)!==8.1||meta.storageMode!=='supabase-row-v8.1')throw new Error('V8.1 build metadata invalid');

          const index=fs.readFileSync('index.html','utf8');
          for(const s of ['slh-v81-20260910','css/utility-v81.css','css/icons-v81.css','css/runtime-fix-v82.css','js/auth-v81-patch.js','js/v7/boot.js','Cloud only'])if(!index.includes(s))throw new Error('index missing '+s);
          for(const forbidden of ['cdn.tailwindcss.com','unpkg.com/@phosphor-icons','fonts.googleapis.com','cdn.jsdelivr.net/npm/jszip'])if(index.includes(forbidden))throw new Error('runtime CDN dependency remains: '+forbidden);

          const db=fs.readFileSync('js/db.js','utf8');
          for(const s of ['DB_VERSION=5',"deleteObjectStore(legacy)",'hydrateCloudLinks','applyCloudChanges','expectedVersion','createSafetyBackup','previewCloudImport','purgeTrashItem','Mass link deletion is blocked','supabase-row-v8.1','getIntegrityStatus','verifyBackup','logRuntimeEvent'])if(!db.includes(s))throw new Error('V8.1 db missing '+s);
          if(/createObjectStore\(['\"]links['\"]/.test(db)||/createObjectStore\(['\"]trash['\"]/.test(db)||/createObjectStore\(['\"]tombstones['\"]/.test(db))throw new Error('Persistent browser link stores must remain removed');

          const cloud=fs.readFileSync('js/cloud-links.js','utf8');
          for(const s of ['smartlink_link_update_v2','smartlink_link_delete_v2','smartlink_link_restore_v2','smartlink_link_changes_since','smartlink_integrity_status','smartlink_backup_verify','smartlink_import_preview','smartlink_runtime_event_put','smartlink_link_purge','CloudConflictError','Server confirmed'])if(!cloud.includes(s))throw new Error('V8.1 cloud client missing '+s);
          const runtime=fs.readFileSync('js/runtime-fix-v82.js','utf8');
          for(const s of ['POLL_MS=12000','BroadcastChannel','hydrateCloudLinks','SmartLinkV81=api','updateSidebar','slh_v82_change'])if(!runtime.includes(s))throw new Error('V8.2 runtime repair missing '+s);
          const sync=fs.readFileSync('js/auto-cloud-sync.js','utf8');
          for(const s of ['RPC_TIMEOUT_MS=7000','applyingRemote','sameLegacyState','smartlink:cloud-force-sync','Cloud ready'])if(!sync.includes(s))throw new Error('Cloud settings sync repair missing '+s);
          const css=fs.readFileSync('css/runtime-fix-v82.css','utf8');
          for(const s of ['appearance:none','#sidebar-nav>.slh-v710-item','background:rgba(255,255,255,.018)'])if(!css.includes(s))throw new Error('Sidebar reset repair missing '+s);
          const data=fs.readFileSync('js/v8-data-center.js','utf8');
          for(const s of ['Data Integrity Center','Backup checksums','Production Observability','Permanent delete','Verify & restore backup','purgeTrashItem'])if(!data.includes(s))throw new Error('V8.1 Data Center missing '+s);
          const auth=fs.readFileSync('js/auth-v81-patch.js','utf8');if(!auth.includes("const USER='meka'")||auth.includes('112233'))throw new Error('Auth identity patch invalid or credential material committed');
          const capture=fs.readFileSync('js/v7/quick-capture.js','utf8');for(const s of ['CLOUD ONLY','Writing directly to Supabase','Saved to Supabase','Nothing is stored locally'])if(!capture.includes(s))throw new Error('Quick Capture contract missing '+s);

          const m81=migrations.slice(2).map(f=>fs.readFileSync(f,'utf8')).join('\n');
          for(const s of ['username_key=\'meka\'','smartlink_link_update_v2','version_conflict','smartlink_link_changes_since','smartlink_integrity_status','smartlink_backup_verify','smartlink_runtime_events','smartlink_link_purge'])if(!m81.includes(s))throw new Error('V8.1 migration set missing '+s);
          if(m81.includes('112233'))throw new Error('Credential must never be committed in migrations');

          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));if(manifest.name!=='Smart Link Hub V8.1'||!manifest.share_target||manifest.shortcuts?.length<4||!/live multi-device sync/i.test(manifest.description))throw new Error('PWA V8.1 metadata incomplete');
          const sw=fs.readFileSync('sw.js','utf8');for(const s of ['slh-v82-cloud-ui-repair','utility-v81.css','icons-v81.css','runtime-fix-v82.css','auth-v81-patch.js','runtime-fix-v82.js'])if(!sw.includes(s))throw new Error('Service worker repair cache missing '+s);
          const headers=fs.readFileSync('_headers','utf8');for(const s of ['X-Content-Type-Options: nosniff','X-Frame-Options: DENY','Strict-Transport-Security:','Content-Security-Policy-Report-Only:'])if(!headers.includes(s))throw new Error('header missing '+s);
          console.log('V8.1 + V8.2 runtime repair contracts OK');
          NODE

      - name: Secret hygiene guard
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const ignore=new Set(['.git','node_modules','.github','playwright-report','test-results']);
          const patterns=[/SUPABASE_SERVICE_ROLE_KEY\s*[=:]/i,/\bsb_secret_[A-Za-z0-9._-]{20,}/,/\bsk_live_[A-Za-z0-9]{12,}/,/-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/];
          let hits=[];function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){if(e.isDirectory()&&ignore.has(e.name))continue;const p=path.join(d,e.name);if(e.isDirectory())walk(p);else{if(fs.statSync(p).size>2e6)continue;let t='';try{t=fs.readFileSync(p,'utf8')}catch{}if(patterns.some(r=>r.test(t)))hits.push(p)}}}walk('.');if(hits.length){console.error('Potential privileged secrets:',hits);process.exit(1)}
          NODE

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: Browser E2E
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
