<!doctype html><html lang="th" data-theme="gold"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020304"><meta name="robots" content="noindex,nofollow"><title>Shared Smart Link Hub</title><style>:root{--bg:#020304;--bg2:#07090d;--panel:rgba(7,10,15,.94);--border:rgba(255,255,255,.09);--accent:#f5c542;--accent2:#ffe28a;--muted:#8b919c;--text:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -5%,rgba(245,197,66,.12),transparent 30%),linear-gradient(145deg,var(--bg),var(--bg2));color:var(--text);font:13px Inter,system-ui,sans-serif}.shell{width:min(1100px,calc(100% - 28px));margin:0 auto;padding:42px 0 70px}.head{padding:22px;border:1px solid var(--border);border-radius:22px;background:var(--panel);box-shadow:0 24px 80px rgba(0,0,0,.35)}.k{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}h1{font-size:28px;margin:8px 0 6px;letter-spacing:-.04em}.meta{color:var(--muted);font-size:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.card{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:11px;align-items:center;padding:13px;border:1px solid var(--border);border-radius:16px;background:var(--panel);color:inherit;text-decoration:none;transition:.18s}.card:hover{transform:translateY(-2px);border-color:rgba(245,197,66,.28);box-shadow:0 16px 45px rgba(200,137,0,.12)}.thumb{width:56px;height:44px;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:#0c0f14;color:var(--accent);font-weight:800}.thumb img{width:100%;height:100%;object-fit:cover}.card h3{margin:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{margin:5px 0 0;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{display:inline-flex;margin-top:7px;padding:3px 6px;border:1px solid var(--border);border-radius:99px;color:var(--accent2);font-size:7px}.arrow{color:var(--accent);font-size:18px}.error{padding:30px;text-align:center;border:1px solid rgba(239,68,68,.2);border-radius:18px;background:rgba(239,68,68,.04);color:#fecaca}@media(max-width:720px){.shell{padding-top:22px}.grid{grid-template-columns:1fr}.card{grid-template-columns:48px minmax(0,1fr) auto}.thumb{width:48px;height:40px}}</style></head><body><main class="shell"><section id="head" class="head"><div class="k">Shared Smart Link Hub</div><h1>Loading shared library…</h1><div class="meta">Secure read-only snapshot</div></section><section id="grid" class="grid"></section></main><script>(()=>{'use strict';const URL='https://gfqkexnqbjtuwsyqacsw.supabase.co',KEY='sb_publishable_jsDnGIrAjuf0b9w9Hy1z8g_u9SXAfht',$=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){const token=new URLSearchParams(location.search).get('token')||'';if(!/^[a-f0-9]{48}$/i.test(token))throw new Error('Invalid or missing share token');const r=await fetch(`${URL}/rest/v1/rpc/smartlink_share_get`,{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({p_share_token:token}),cache:'no-store'});if(!r.ok)throw new Error('Shared snapshot is unavailable');const rows=await r.json(),row=rows?.[0];if(!row)throw new Error('This share has expired or was revoked');const p=row.payload||{},links=Array.isArray(p.links)?p.links:[];$('#head').innerHTML=`<div class="k">Shared Smart Link Hub · ${esc(row.permission||'viewer')}</div><h1>${esc(p.title||'Shared library')}</h1><div class="meta">${links.length} links · created ${esc(p.createdAt||row.created_at||'')} ${row.expires_at?`· expires ${esc(row.expires_at)}`:''}</div>`;$('#grid').innerHTML=links.map(l=>`<a class="card" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"><div class="thumb">${l.imageUrl?`<img src="${esc(l.imageUrl)}" loading="lazy" referrerpolicy="no-referrer">`:'↗'}</div><div><h3>${esc(l.title||l.domain)}</h3><p>${esc(l.description||l.domain||l.url)}</p><span class="tag">${esc(l.category||l.contentType||'Saved link')}</span></div><div class="arrow">↗</div></a>`).join('')||'<div class="error">This shared snapshot contains no links.</div>'}run().catch(e=>{$('#head').innerHTML=`<div class="k">Shared Smart Link Hub</div><h1>Share unavailable</h1><div class="meta">The link may have expired or been revoked.</div>`;$('#grid').innerHTML=`<div class="error">${esc(e.message)}</div>`})})();</script></body></html>
