<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Link Hub</title>
  <style>
    html,body{margin:0;min-height:100%;background:#050508;color:#e2e8f0;font-family:Inter,system-ui,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,rgba(14,165,233,.14),transparent 45%),#050508}
    .boot-card{padding:24px 28px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:rgba(17,18,24,.82);backdrop-filter:blur(18px);box-shadow:0 20px 70px rgba(0,0,0,.35)}
    .dot{display:inline-block;width:8px;height:8px;margin-right:10px;border-radius:50%;background:#22d3ee;box-shadow:0 0 18px #22d3ee;animation:pulse 1s ease-in-out infinite alternate}
    @keyframes pulse{to{opacity:.35;transform:scale(.7)}}
  </style>
</head>
<body>
  <div id="boot"><div class="boot-card"><span class="dot"></span>Loading Smart Link Hub…</div></div>
  <script>
    (async () => {
      const files = Array.from({ length: 9 }, (_, i) => `parts/part-${String(i).padStart(2, '0')}.txt`);
      const responses = await Promise.all(files.map(file => fetch(file, { cache: 'no-store' })));
      const failed = responses.findIndex(r => !r.ok);
      if (failed !== -1) throw new Error(`Unable to load ${files[failed]} (${responses[failed].status})`);
      const parts = await Promise.all(responses.map(r => r.text()));
      const html = parts.join('');
      document.open();
      document.write(html);
      document.close();
    })().catch(error => {
      console.error(error);
      document.getElementById('boot').innerHTML = `<div class="boot-card">Unable to start Smart Link Hub<br><small>${String(error)}</small></div>`;
    });
  </script>
</body>
</html>
