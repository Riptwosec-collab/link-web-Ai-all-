<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#060b13" />
  <meta name="description" content="Smart Link Hub — local-first intelligent web library" />
  <link rel="manifest" href="manifest.webmanifest?v=5.5.1" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <title>Smart Link Hub V5.5.1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://unpkg.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{brand:{dark:'#060b13',panel:'#0b1420',accent:'#3b82f6',cyan:'#22d3ee',violet:'#8b5cf6'}}}}}
  </script>
  <link rel="stylesheet" href="css/app.css?v=5.5.1" />
  <link rel="stylesheet" href="css/performance-v51.css?v=5.5.1" />
  <link rel="stylesheet" href="css/card-v12.css?v=5.5.1" />
  <link rel="stylesheet" href="css/nav-v5.css?v=5.5.1" />
  <link rel="stylesheet" href="css/premium-v51.css?v=5.5.1" />
  <link rel="stylesheet" href="css/smooth-v52.css?v=5.5.1" />
  <link rel="stylesheet" href="css/neo-v54.css?v=5.5.1" />
</head>
<body class="h-[100dvh] overflow-hidden bg-brand-dark text-slate-200 antialiased">
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="noise"></div>
  <div id="app" class="relative z-10 h-full flex">
    <aside id="sidebar" class="sidebar w-[260px] shrink-0 h-full flex flex-col border-r border-white/[.06] bg-[#090a10]/80 backdrop-blur-2xl">
      <div class="px-5 pt-[max(20px,env(safe-area-inset-top))] pb-4">
        <button data-page="home" class="brand-button flex items-center gap-3 w-full text-left">
          <div class="brand-mark"><i class="ph-fill ph-link-simple text-white"></i></div>
          <div><div class="font-semibold text-white tracking-tight">Smart Link Hub</div><div class="text-[9px] text-cyan-300/70 tracking-[.22em] uppercase">Intelligent library</div></div>
        </button>
      </div>
      <nav id="sidebar-nav" class="px-3 flex-1 overflow-y-auto space-y-1">
        <div class="nav-label">Main</div>
        <button class="nav-item active" data-page="home"><i class="ph-fill ph-house"></i><span>Home</span></button>
        <button class="nav-item" data-page="search"><i class="ph ph-squares-four"></i><span>Library</span></button>
        <button class="nav-item" data-page="collections"><i class="ph ph-folders"></i><span>Collections</span></button>
        <button class="nav-item" data-page="favorites"><i class="ph ph-star"></i><span>Favorites</span></button>
        <div class="nav-label">Insights</div>
        <button class="nav-item" data-page="analytics"><i class="ph ph-chart-line-up"></i><span>Insights</span></button>
        <div class="nav-label">System</div>
        <button class="nav-item" data-page="workspaces"><i class="ph ph-dots-three-circle"></i><span>More</span></button>
        <button class="nav-item" data-page="settings"><i class="ph ph-gear-six"></i><span>Settings</span></button>
      </nav>
      <div class="p-3 pb-[max(12px,env(safe-area-inset-bottom))]">
        <div class="glass-panel p-4 rounded-2xl">
          <div class="flex items-center justify-between"><span class="text-[10px] text-slate-500 uppercase tracking-widest">Library</span><span id="sync-pill" class="status-pill local"><span></span>Auto Cloud</span></div>
          <div class="grid grid-cols-3 gap-2 mt-3 text-center"><div><b id="side-links">0</b><small>Links</small></div><div><b id="side-favs">0</b><small>Favs</small></div><div><b id="side-cols">0</b><small>Lists</small></div></div>
        </div>
      </div>
    </aside>

    <main class="min-w-0 flex-1 h-full flex flex-col">
      <header class="topbar h-16 shrink-0 px-5 md:px-8 flex items-center border-b border-white/[.04] bg-black/10 backdrop-blur-xl">
        <div class="v5-header-left flex items-center gap-3 min-w-0">
          <button id="mobile-menu" class="icon-btn md:hidden"><i class="ph ph-list"></i></button>
          <div><div id="page-eyebrow" class="text-[9px] uppercase tracking-[.24em] text-cyan-300/60">Library</div><h1 id="page-title" class="text-sm font-semibold text-white truncate">Home</h1></div>
        </div>
        <div class="v5-header-center">
          <label class="v5-global-search" for="global-search">
            <i class="ph ph-magnifying-glass"></i>
            <input id="global-search" type="search" placeholder="Search links, collections, tags…" autocomplete="off" spellcheck="false" />
            <kbd>⌘K</kbd>
          </label>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="command-btn" class="command-trigger hidden lg:flex"><i class="ph ph-command"></i><span>Command</span><kbd>⌘P</kbd></button>
          <button id="add-link-btn" class="icon-btn accent" title="Add link"><i class="ph ph-plus"></i></button>
          <button id="install-btn" class="icon-btn hidden" title="Install app"><i class="ph ph-download-simple"></i></button>
        </div>
      </header>
      <section id="dynamic-content" class="flex-1 min-h-0 overflow-y-auto px-4 md:px-8 py-6 md:py-8"></section>
    </main>
  </div>

  <div id="modal-root"></div><div id="toast-root" class="toast-root"></div>
  <div id="command-overlay" class="command-overlay hidden" aria-hidden="true"></div>
  <input id="import-file" type="file" accept=".json,.csv,.html,.htm" class="hidden" />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <script src="js/auth-gate.js?v=5.5.1"></script>
  <script type="module" src="js/app.js?v=5.5.1"></script>
  <script type="module" src="js/nav-v5.js?v=5.5.1"></script>
  <script type="module" src="js/instant-save-v9.js?v=5.5.1"></script>
  <script type="module" src="js/metadata-repair.js?v=5.5.1"></script>
  <script type="module" src="js/card-v12.js?v=5.5.1"></script>
  <script type="module" src="js/auto-cloud-sync.js?v=5.5.1"></script>
  <script src="js/auto-cloud-ui.js?v=5.5.1"></script>
  <script src="js/smooth-v52.js?v=5.5.1"></script>
  <script type="module" src="js/interaction-v53.js?v=5.5.1"></script>
  <script type="module" src="js/analytics-v53.js?v=5.5.1"></script>
  <script src="js/neo-v54.js?v=5.5.1"></script>
  <script src="js/shortcuts-v51.js?v=5.5.1"></script>
</body>
</html>
